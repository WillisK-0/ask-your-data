<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="color-scheme" content="light dark"><title>Policy answer</title>
<style>
  :root { --bg: var(--color-background-primary, #fff); --bg2: var(--color-background-secondary, #f5f4ed); --fg: var(--color-text-primary, #141413); --fg2: var(--color-text-secondary, #3d3d3a); --fg3: var(--color-text-tertiary, #73726c); --line: var(--color-border-tertiary, rgba(31,30,29,.15)); --line2: var(--color-border-secondary, rgba(31,30,29,.3)); --inv: var(--color-background-inverse, #141413); --invfg: var(--color-text-inverse, #fff); --warnbg: var(--color-background-warning, #f6eedf); --r: var(--border-radius-md, 8px); --sans: var(--font-sans, system-ui, sans-serif); --mono: var(--font-mono, ui-monospace, monospace); }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--sans); font-size: 14px; line-height: 1.45; color: var(--fg); background: transparent; }
  .wrap { padding: 4px 2px 8px; }
  .top { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .top b { font-weight: 600; }
  .top .muted { color: var(--fg3); font-size: 12px; }
  .hit { border: 0.5px solid var(--line2); border-radius: var(--r); padding: 12px 14px; margin-bottom: 10px; background: var(--bg); }
  .hit .src { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--fg3); margin-bottom: 6px; flex-wrap: wrap; }
  .hit .src code { font-family: var(--mono); font-size: 11px; background: var(--bg2); padding: 1px 6px; border-radius: 4px; color: var(--fg2); }
  .hit .src .score { margin-left: auto; }
  .hit h3 { margin: 0 0 6px; font-size: 14px; font-weight: 600; }
  .hit p { margin: 0 0 6px; color: var(--fg2); white-space: pre-wrap; }
  .hit p:last-child { margin-bottom: 0; }
  mark { background: var(--warnbg); color: inherit; padding: 0 2px; border-radius: 3px; }
  .hit.best { border-color: var(--inv); }
  .hit.best .badge { font-size: 11px; background: var(--inv); color: var(--invfg); padding: 1px 7px; border-radius: 999px; }
  .btn { border: 0.5px solid var(--line2); background: transparent; color: var(--fg); font: inherit; font-size: 12px; padding: 6px 12px; border-radius: 999px; cursor: pointer; min-height: 30px; }
  .btn.pri { background: var(--inv); color: var(--invfg); border-color: var(--inv); }
  .foot { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; color: var(--fg3); font-size: 12px; margin-top: 4px; }
  .foot .spacer { flex: 1; }
  .empty { color: var(--fg3); padding: 18px; text-align: center; }
  .skel { height: 100px; background: linear-gradient(90deg, var(--bg2) 25%, var(--bg) 50%, var(--bg2) 75%); background-size: 200% 100%; border-radius: var(--r); animation: sh 1.2s infinite; }
  @keyframes sh { from { background-position: 200% 0 } to { background-position: -200% 0 } }
</style></head>
<body>
<div class="wrap" id="root">
  <div class="top"><b id="title">Policy lookup</b><span class="muted" id="sub">Searching the handbook…</span></div>
  <div id="hits"><div class="skel"></div></div>
  <div class="foot"><span id="status">Every answer shows the document and section it came from.</span><span class="spacer"></span><button class="btn" id="cite" hidden>Ask Claude to quote this in a reply</button></div>
</div>
<script type="module">
  const $ = (id) => document.getElementById(id);
  let host;
  if (window.__DEMO_HOST__) host = window.__DEMO_HOST__;
  else {
    const { App } = await import("https://unpkg.com/@modelcontextprotocol/ext-apps@1.7.5/dist/src/app-with-deps.js");
    const app = new App({ name: "Policy answer", version: "0.2.0" });
    host = { onResult: (fn) => { app.ontoolresult = fn; }, onInput: (fn) => { app.ontoolinput = fn; }, sendMessage: (t) => app.sendMessage({ role: "user", content: [{ type: "text", text: t }] }), connect: () => app.connect() };
  }
  let query = "", best = null;
  const terms = (q) => q.toLowerCase().split(/[^a-z0-9]+/).filter(t => t.length > 3);
  function highlight(text, q) {
    const frag = document.createDocumentFragment(); const ts = terms(q); if (!ts.length) { frag.append(text); return frag; }
    const re = new RegExp("(" + ts.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")", "gi");
    let last = 0; for (const m of text.matchAll(re)) { frag.append(text.slice(last, m.index)); const mk = document.createElement("mark"); mk.textContent = m[0]; frag.append(mk); last = m.index + m[0].length; }
    frag.append(text.slice(last)); return frag;
  }
  function show(result) {
    const sc = result.structuredContent; const box = $("hits"); box.replaceChildren();
    if (!sc || !Array.isArray(sc.results)) { const e = document.createElement("div"); e.className = "empty"; e.textContent = result.content?.[0]?.text ?? "No result."; box.appendChild(e); return; }
    query = sc.query ?? query; $("title").textContent = "Policy lookup"; $("sub").textContent = `${sc.results.length} matching ${sc.results.length === 1 ? "section" : "sections"} for “${query}”`;
    best = sc.results[0] ?? null;
    sc.results.forEach((r, i) => {
      const h = document.createElement("div"); h.className = "hit" + (i === 0 ? " best" : "");
      const src = document.createElement("div"); src.className = "src";
      const code = document.createElement("code"); code.textContent = r.file; src.appendChild(code);
      const sec = document.createElement("span"); sec.textContent = "› " + r.heading; src.appendChild(sec);
      if (i === 0) { const b = document.createElement("span"); b.className = "badge"; b.textContent = "Best match"; src.appendChild(b); }
      const sco = document.createElement("span"); sco.className = "score"; sco.textContent = `${r.score} term${r.score === 1 ? "" : "s"} matched`; src.appendChild(sco);
      h.appendChild(src);
      const body = r.text.replace(/^#{1,3} .*\n?/, "").trim();
      for (const para of body.split(/\n\n+/)) { const p = document.createElement("p"); p.appendChild(highlight(para.replace(/^- /gm, "• "), query)); h.appendChild(p); }
      box.appendChild(h);
    });
    $("cite").hidden = !best;
    if (!sc.results.length) { const e = document.createElement("div"); e.className = "empty"; e.textContent = "Nothing in the handbook matches. Claude will say so rather than guess."; box.appendChild(e); }
  }
  $("cite").onclick = () => host.sendMessage?.(`Write a short reply to the customer using this policy section, and name the document it comes from:\n\n${best.file} › ${best.heading}\n${best.text}`);
  host.onInput?.(({ arguments: args }) => { if (args?.query) { query = args.query; $("sub").textContent = `Searching for “${query}”…`; } });
  host.onResult?.(show);
  await host.connect?.();
</script>
</body></html>
